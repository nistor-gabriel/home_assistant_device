# -------------------------------------------------------------------------------------------------------------------------------------------------

light:
  - platform: template
    lights:
      lumina_stalp_gradina:
        unique_id: lumina_stalp_gradina
        friendly_name: Lumina Stalp Gradina
        value_template: "{{ states('sensor.lumina_stalp_gradina_status') }}"
        turn_on:
          - service: rest_command.lumina_stalp_gradina_set
            data:
              set: on
          - service: homeassistant.update_entity
            entity_id: sensor.lumina_stalp_gradina_status
        turn_off:
          - service: rest_command.lumina_stalp_gradina_set
            data:
              set: off
          - service: homeassistant.update_entity
            entity_id: sensor.lumina_stalp_gradina_status

# -------------------------------------------------------------------------------------------------------------------------------------------------

switch:
  - platform: template
    switches:
      pompa:
        unique_id: pompa_gradina
        friendly_name: Pompa
        value_template: "{{ states('sensor.pompa_gradina_status') }}"
        turn_on:
          - service: rest_command.pompa_gradina_set
            data:
              set: on
          - service: homeassistant.update_entity
            entity_id: sensor.pompa_gradina_status
        turn_off:
          - service: rest_command.pompa_gradina_set
            data:
              set: off
          - service: homeassistant.update_entity
            entity_id: sensor.pompa_gradina_status

# -------------------------------------------------------------------------------------------------------------------------------------------------

timer:
  door_bell_lock:
    name: Poarta
    icon: mdi:timer

# -------------------------------------------------------------------------------------------------------------------------------------------------

lock:
  - platform: template
    name: Poarta
    unique_id: door_bell
    value_template: "{{ not is_state('timer.door_bell_lock', 'active') }}"
    optimistic: false
    lock:
    unlock:
      - service: dahua_vto.open_door
        data_template:
          entity_id: sensor.door_bell_status
          channel: 1
          short_number: HA

# -------------------------------------------------------------------------------------------------------------------------------------------------

logger:
       default: info
       logs:
         homeassistant.components.mqtt: debug

