
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# -------------------------------------------------------------------------------------------------------------------------------------------------

sensor:
  - platform: template
    sensors:
      power_in_battery:
        friendly_name: Putere Incarcare Baterie
        unique_id: power_in_battery
        unit_of_measurement: W
        device_class: power
        value_template:  >-
          {% set power = int(states('sensor.victron_system_battery_power')) %}
          {% if power > 0 %} {{ power }}
          {% else %} {{ 0 }}
          {% endif %}
      power_out_battery:
        friendly_name: Putere Descarcare Baterie
        unique_id: power_out_battery
        unit_of_measurement: W
        device_class: power
        value_template:  >-
          {% set power = int(states('sensor.victron_system_battery_power')) %}
          {% if power < 0 %} {{ power | abs }}
          {% else %} {{ 0 }}
          {% endif %}
      power_in_grid:
        friendly_name: Putere In Retea
        unique_id: power_in_grid
        unit_of_measurement: W
        device_class: power
        value_template:  >-
          {% set power = int(states('sensor.victron_system_grid_l1')) %}
          {% if power < 0 %} {{ power | abs }}
          {% else %} {{ 0 }}
          {% endif %}
      power_out_grid:
        friendly_name: Putere Din Retea
        unique_id: power_out_grid
        unit_of_measurement: W
        device_class: power
        value_template:  >-
          {% set power = int(states('sensor.victron_system_grid_l1')) %}
          {% if power > 0 %} {{ power }}
          {% else %} {{ 0 }}
          {% endif %}
  - platform: integration
    source: sensor.pv_power
    name: Energie Produsa
    unique_id: energy_produced
    unit_prefix: k
  - platform: integration
    source: sensor.power_in_battery
    name: Energie Incarcare Baterie
    unique_id: energy_in_battery
    unit_prefix: k
  - platform: integration
    source: sensor.power_out_battery
    name: Energie Descarcare Baterie
    unique_id: energy_out_battery
    unit_prefix: k
  - platform: integration
    source: sensor.power_in_grid
    name: Energie In Retea
    unique_id: energy_in_grid
    unit_prefix: k
  - platform: integration
    source: sensor.power_out_grid
    name: Energie Din Retea
    unique_id: energy_out_grid
    unit_prefix: k

# -------------------------------------------------------------------------------------------------------------------------------------------------

timer:
  door_bell_lock:
    name: Poarta
    icon: mdi:timer

# -------------------------------------------------------------------------------------------------------------------------------------------------

lock:
  - platform: template
    name: Poarta
    unique_id: door_bell
    value_template: "{{ not is_state('timer.door_bell_lock', 'active') }}"
    optimistic: false
    lock:
    unlock:
      - service: dahua_vto.open_door
        data_template:
          entity_id: sensor.door_bell_status
          channel: 1
          short_number: HA

