
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# -------------------------------------------------------------------------------------------------------------------------------------------------

sensor:
  - platform: rest
    unique_id: lumina_stalp_gradina_status
    name: Lumina Stalp Gradina
    icon: mdi:coach-lamp
    resource: http://192.168.100.80/relay/2
    username: user
    password: !secret rest_password
    authentication: basic
    value_template: >-
          {% if value_json.on == true %} on
          {% else %} off
          {% endif %}
  - platform: rest
    unique_id: pompa_gradina_status
    name: Pompa Gradina
    icon: mdi:water-pump
    resource: http://192.168.100.80/relay/1
    username: user
    password: !secret rest_password
    authentication: basic
    value_template: >-
          {% if value_json.on == true %} on
          {% else %} off
          {% endif %}
  - platform: rest
    unique_id: pompa_gradina_presiune
    name: Pompa Presiune
    icon: mdi:water-pump
    resource: http://192.168.100.80/pump/pressure
    username: user
    password: !secret rest_password
    authentication: basic
    value_template: "{{ value_json.pressure }}"
  - platform: rest
    unique_id: stropitoare_fata_1_status
    name: Stropitoare fata 1
    icon: mdi:sprinkler
    resource: http://192.168.100.82/relay/2
    username: user
    password: !secret rest_password
    authentication: basic
    value_template: >-
          {% if value_json.on == true %} on
          {% else %} off
          {% endif %}
  - platform: rest
    unique_id: stropitoare_fata_2_status
    name: Stropitoare fata 2
    icon: mdi:sprinkler
    resource: http://192.168.100.82/relay/1
    username: user
    password: !secret rest_password
    authentication: basic
    value_template: >-
          {% if value_json.on == true %} on
          {% else %} off
          {% endif %}
  - platform: rest
    unique_id: stropitoare_spate_1_status
    name: Stropitoare spate 1
    icon: mdi:sprinkler
    resource: http://192.168.100.81/relay/3
    username: user
    password: !secret rest_password
    authentication: basic
    value_template: >-
          {% if value_json.on == true %} on
          {% else %} off
          {% endif %}
  - platform: rest
    unique_id: stropitoare_spate_2_status
    name: Stropitoare spate 2
    icon: mdi:sprinkler
    resource: http://192.168.100.81/relay/2
    username: user
    password: !secret rest_password
    authentication: basic
    value_template: >-
          {% if value_json.on == true %} on
          {% else %} off
          {% endif %}
  - platform: rest
    unique_id: stropitoare_spate_3_status
    name: Stropitoare spate 3
    icon: mdi:sprinkler
    resource: http://192.168.100.81/relay/1
    username: user
    password: !secret rest_password
    authentication: basic
    value_template: >-
          {% if value_json.on == true %} on
          {% else %} off
          {% endif %}
  - platform: rest
    unique_id: stropitoare_spate_4_status
    name: Stropitoare spate 4
    icon: mdi:sprinkler
    resource: http://192.168.100.81/relay/4
    username: user
    password: !secret rest_password
    authentication: basic
    value_template: >-
          {% if value_json.on == true %} on
          {% else %} off
          {% endif %}
  - platform: rest
    unique_id: stropitoare_spate_5_status
    name: Stropitoare spate 5
    icon: mdi:sprinkler
    resource: http://192.168.100.81/relay/5
    username: user
    password: !secret rest_password
    authentication: basic
    value_template: >-
          {% if value_json.on == true %} on
          {% else %} off
          {% endif %}
  - platform: dahua_vto
    unique_id: door_bell_status
    name: Sonerie
    host: 192.168.100.66
    username: admin
    password: sigma2000
    scan_interval: 5

  - platform: template
    sensors:
      power_in_battery:
        friendly_name: Putere Incarcare Baterie
        unique_id: power_in_battery
        unit_of_measurement: W
        device_class: power
        value_template:  >-
          {% set power = int(states('sensor.victron_system_battery_power')) %}
          {% if power > 0 %} {{ power }}
          {% else %} {{ 0 }}
          {% endif %}
      power_out_battery:
        friendly_name: Putere Descarcare Baterie
        unique_id: power_out_battery
        unit_of_measurement: W
        device_class: power
        value_template:  >-
          {% set power = int(states('sensor.victron_system_battery_power')) %}
          {% if power < 0 %} {{ power | abs }}
          {% else %} {{ 0 }}
          {% endif %}
      power_in_grid:
        friendly_name: Putere In Retea
        unique_id: power_in_grid
        unit_of_measurement: W
        device_class: power
        value_template:  >-
          {% set power = int(states('sensor.victron_system_grid_l1')) %}
          {% if power < 0 %} {{ power | abs }}
          {% else %} {{ 0 }}
          {% endif %}
      power_out_grid:
        friendly_name: Putere Din Retea
        unique_id: power_out_grid
        unit_of_measurement: W
        device_class: power
        value_template:  >-
          {% set power = int(states('sensor.victron_system_grid_l1')) %}
          {% if power > 0 %} {{ power }}
          {% else %} {{ 0 }}
          {% endif %}
  - platform: integration
    source: sensor.pv_power
    name: Energie Produsa
    unique_id: energy_produced
    unit_prefix: k
  - platform: integration
    source: sensor.power_in_battery
    name: Energie Incarcare Baterie
    unique_id: energy_in_battery
    unit_prefix: k
  - platform: integration
    source: sensor.power_out_battery
    name: Energie Descarcare Baterie
    unique_id: energy_out_battery
    unit_prefix: k
  - platform: integration
    source: sensor.power_in_grid
    name: Energie In Retea
    unique_id: energy_in_grid
    unit_prefix: k
  - platform: integration
    source: sensor.power_out_grid
    name: Energie Din Retea
    unique_id: energy_out_grid
    unit_prefix: k

